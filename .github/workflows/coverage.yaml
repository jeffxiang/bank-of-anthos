# Report-only coverage. This workflow never enforces a coverage threshold and
# never blocks a build: it prints per-service summaries and uploads the raw
# reports as artifacts.
name: Coverage (report-only)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Java (JaCoCo)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run tests with coverage
        run: mvn -B test

      - name: Print coverage summary
        run: |
          for MODULE in ledgerwriter balancereader transactionhistory; do
            CSV="src/ledger/$MODULE/target/site/jacoco/jacoco.csv"
            if [ ! -f "$CSV" ]; then
              echo "$MODULE: no jacoco.csv"
              continue
            fi
            awk -F, -v m="$MODULE" 'NR>1 {bm+=$6; bc+=$7; lm+=$8; lc+=$9}
              END {
                printf "%s: line %.1f%% (%d/%d), branch %.1f%% (%d/%d)\n",
                  m, lc*100/(lm+lc), lc, lm+lc, bc*100/(bm+bc), bc, bm+bc
              }' "$CSV" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: src/ledger/*/target/site/jacoco/
          if-no-files-found: warn

  python:
    name: Python (pytest-cov) — ${{ matrix.name }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: userservice
            service: accounts/userservice
          - name: contacts
            service: accounts/contacts
          - name: frontend
            service: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run tests with coverage
        working-directory: src/${{ matrix.service }}
        run: |
          uv run pytest -v -p no:warnings \
            --cov=. --cov-report=term --cov-report=xml:coverage.xml \
            > coverage.txt 2>&1 || [ $? -eq 5 ]
          cat coverage.txt
          echo '${{ matrix.service }}' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Name|TOTAL|-+$|[A-Za-z_./-]+\.py)' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage-${{ matrix.name }}
          path: src/${{ matrix.service }}/coverage.xml
          if-no-files-found: warn

  angular:
    name: Angular (karma-coverage)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
          cache: 'npm'
          cache-dependency-path: src/ui-angular/package-lock.json

      - name: Install dependencies
        working-directory: src/ui-angular
        run: npm ci

      - name: Run tests with coverage
        working-directory: src/ui-angular
        run: npm run test:coverage | tee coverage.txt

      - name: Print coverage summary
        working-directory: src/ui-angular
        run: grep -A 10 'Coverage summary' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: angular-coverage
          path: src/ui-angular/coverage/
          if-no-files-found: warn
