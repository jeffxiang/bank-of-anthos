name: unit-test-coverage
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  coverage:
    # Report-only: coverage is collected and uploaded, but never fails the build.
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Run Java + Python unit tests with coverage
        continue-on-error: true
        run: make test-unit
      - name: Set up Node 16.10
        uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
      - name: Install Angular dependencies
        continue-on-error: true
        working-directory: src/ui-angular
        run: npm ci
      - name: Run Angular tests with coverage
        continue-on-error: true
        working-directory: src/ui-angular
        run: npm run test:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          if-no-files-found: warn
          path: |
            src/ledger/*/target/site/jacoco/jacoco.xml
            src/**/coverage.xml
            src/ui-angular/coverage/**
