name: Unit tests and coverage (report-only)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  jvm-and-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: astral-sh/setup-uv@v5

      - name: make test-unit (JaCoCo + pytest-cov)
        continue-on-error: true
        run: make test-unit

      - name: Coverage summary
        continue-on-error: true
        run: ./.github/workflows/scripts/coverage-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-jvm-python
          path: |
            src/ledger/*/target/site/jacoco/**
            src/**/coverage.xml
          if-no-files-found: warn

  angular:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/ui-angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
          cache: npm
          cache-dependency-path: src/ui-angular/package-lock.json

      - run: npm ci

      - name: ng test --code-coverage
        continue-on-error: true
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-ui-angular
          path: src/ui-angular/coverage/**
          if-no-files-found: warn
