# Report-only coverage. Every step is continue-on-error so this workflow can
# never block a PR; it exists to publish baselines until the 90/70 thresholds
# are promoted to a blocking gate.
name: Coverage (report-only)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage-jvm-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run unit tests with coverage
        id: tests
        continue-on-error: true
        run: make test-unit

      - name: Summarize JaCoCo coverage
        continue-on-error: true
        run: |
          echo "### JaCoCo coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "| module | line % | branch % |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for CSV in src/ledger/*/target/site/jacoco/jacoco.csv; do
            [ -f "$CSV" ] || continue
            MODULE=$(echo "$CSV" | cut -d/ -f3)
            awk -F, -v module="$MODULE" 'NR > 1 {
              bm += $6; bc += $7; lm += $8; lc += $9
            } END {
              line = (lm + lc) ? 100 * lc / (lm + lc) : 0
              branch = (bm + bc) ? 100 * bc / (bm + bc) : 0
              printf "| %s | %.1f | %.1f |\n", module, line, branch
            }' "$CSV" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Summarize Python coverage
        continue-on-error: true
        run: |
          echo "### Python coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "| service | line % | branch % |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for XML in src/accounts/*/coverage.xml src/frontend/coverage.xml; do
            [ -f "$XML" ] || continue
            SERVICE=$(dirname "$XML" | sed 's|^src/||')
            LINE=$(sed -n 's/.*line-rate="\([0-9.]*\)".*/\1/p' "$XML" | head -1)
            BRANCH=$(sed -n 's/.*branch-rate="\([0-9.]*\)".*/\1/p' "$XML" | head -1)
            awk -v s="$SERVICE" -v l="$LINE" -v b="$BRANCH" \
              'BEGIN { printf "| %s | %.1f | %.1f |\n", s, 100 * l, 100 * b }' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload coverage reports
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jvm-python
          path: |
            src/ledger/*/target/site/jacoco/
            src/accounts/*/coverage.xml
            src/frontend/coverage.xml
          if-no-files-found: warn

  coverage-angular:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 16.10
        uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
          cache: 'npm'
          cache-dependency-path: src/ui-angular/package-lock.json

      - name: Install dependencies
        continue-on-error: true
        working-directory: src/ui-angular
        run: npm ci

      - name: Run Angular tests with coverage
        continue-on-error: true
        working-directory: src/ui-angular
        run: npm run test:coverage

      - name: Upload coverage report
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui-angular
          path: src/ui-angular/coverage/
          if-no-files-found: warn
