name: Test Coverage (report-only)

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests-coverage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Run unit tests with coverage
        run: make test-unit
        continue-on-error: true

      - name: Upload unit test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: |
            src/ledger/*/target/site/jacoco/**
            src/accounts/*/coverage.xml

  angular-coverage:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 16.10.0
        uses: actions/setup-node@v4
        with:
          node-version: 16.10.0
          cache: npm
          cache-dependency-path: src/ui-angular/package-lock.json

      - name: Install dependencies
        working-directory: src/ui-angular
        run: npm ci

      - name: Run Angular tests with coverage
        working-directory: src/ui-angular
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload Angular coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-coverage
          path: src/ui-angular/coverage/**
