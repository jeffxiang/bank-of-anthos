name: Unit Test Coverage

# Report-only for now: jobs never fail the PR while coverage is being ramped up.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-test-unit:
    name: make test-unit (Java + Python)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run unit tests with coverage
        run: make test-unit

      - name: Coverage summary
        if: always()
        run: |
          for CSV in src/ledger/*/target/site/jacoco/jacoco.csv; do
            [ -f "$CSV" ] || continue
            awk -F, -v f="$CSV" '
              NR > 1 { im += $4; ic += $5; bm += $6; bc += $7 }
              END {
                if (ic + im > 0) printf "%s: line %.1f%%, branch %.1f%%\n", f,
                  100 * ic / (ic + im), (bc + bm > 0 ? 100 * bc / (bc + bm) : 0)
              }' "$CSV"
          done
          for XML in src/accounts/*/coverage.xml src/frontend/coverage.xml; do
            [ -f "$XML" ] || continue
            python3 -c 'import sys, xml.etree.ElementTree as ET; r = ET.parse(sys.argv[1]).getroot(); print("%s: line %.1f%%, branch %.1f%%" % (sys.argv[1], 100 * float(r.get("line-rate", 0)), 100 * float(r.get("branch-rate", 0))))' "$XML"
          done

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-java-coverage
          path: |
            src/ledger/*/target/site/jacoco/
            src/accounts/*/coverage.xml
            src/frontend/coverage.xml
          if-no-files-found: warn

  ui-angular-coverage:
    name: ui-angular coverage
    runs-on: ubuntu-22.04
    continue-on-error: true
    defaults:
      run:
        working-directory: src/ui-angular
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 16.10
        uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
          cache: 'npm'
          cache-dependency-path: src/ui-angular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-angular-coverage
          path: src/ui-angular/coverage/
          if-no-files-found: warn
