# Report-only unit test + coverage workflow: jobs never block merges
# (continue-on-error) and no coverage thresholds are enforced.
name: unit-tests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  java-python-unit-tests:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: astral-sh/setup-uv@v5
      - name: Run Java + Python unit tests with coverage
        run: make test-unit
      - name: Java coverage summary (JaCoCo)
        if: always()
        run: |
          for MODULE in src/ledger/ledgerwriter src/ledger/balancereader src/ledger/transactionhistory; do
            CSV="$MODULE/target/site/jacoco/jacoco.csv"
            if [ -f "$CSV" ]; then
              awk -F, -v m="$MODULE" 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
                END {printf "%s: line %.1f%% (%d/%d), branch %.1f%% (%d/%d)\n",
                     m, (lc+lm)?100*lc/(lc+lm):0, lc, lc+lm,
                     (bc+bm)?100*bc/(bc+bm):0, bc, bc+bm}' "$CSV"
            else
              echo "$MODULE: no jacoco.csv found"
            fi
          done
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-python-coverage
          path: |
            src/ledger/*/target/site/jacoco/
            src/accounts/*/coverage.xml
            src/frontend/coverage.xml
          if-no-files-found: ignore

  angular-unit-tests:
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.10'
          cache: npm
          cache-dependency-path: src/ui-angular/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: src/ui-angular
      - name: Run Angular unit tests with coverage
        run: npm run test:coverage
        working-directory: src/ui-angular
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-coverage
          path: src/ui-angular/coverage/
          if-no-files-found: ignore
