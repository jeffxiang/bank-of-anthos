name: Unit Tests and Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jvm-and-python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: make test-unit (report-only)
        continue-on-error: true
        run: make test-unit
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jvm-python
          if-no-files-found: warn
          path: |
            src/ledger/*/target/site/jacoco/jacoco.xml
            src/accounts/*/coverage.xml
            src/frontend/coverage.xml

  angular:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/ui-angular
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 16.10
        uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
      - run: npm ci
      - name: ng test with coverage (report-only)
        continue-on-error: true
        run: npm run test:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-angular
          if-no-files-found: warn
          path: src/ui-angular/coverage
