name: Unit Tests and Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: make test-unit (Java + Python)
    runs-on: ubuntu-22.04
    # Report-only: coverage is collected and uploaded, failures do not block merges yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run unit tests with coverage
        run: make test-unit

      - name: Summarize coverage
        if: always()
        run: ./.github/scripts/coverage-summary.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jvm-python
          path: |
            src/ledger/*/target/site/jacoco/
            src/accounts/*/coverage.xml
            src/frontend/coverage.xml
          if-no-files-found: warn

  ui-angular-tests:
    name: ui-angular coverage
    runs-on: ubuntu-22.04
    continue-on-error: true
    defaults:
      run:
        working-directory: src/ui-angular
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 16.10
        uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
          cache: npm
          cache-dependency-path: src/ui-angular/package-lock.json

      - run: npm ci

      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui-angular
          path: src/ui-angular/coverage/
          if-no-files-found: warn
