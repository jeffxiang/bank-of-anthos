name: Unit tests and coverage (report-only)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: JVM and Python unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run make test-unit
        continue-on-error: true
        run: make test-unit

      - name: Coverage summary
        continue-on-error: true
        run: |
          for MODULE in ledgerwriter transactionhistory balancereader; do
            CSV="src/ledger/$MODULE/target/site/jacoco/jacoco.csv"
            [ -f "$CSV" ] || continue
            awk -F, -v m="$MODULE" 'NR>1 {bm+=$6; bc+=$7; lm+=$8; lc+=$9}
              END {printf "%s: line %.1f%% (%d/%d), branch %.1f%% (%d/%d)\n",
                   m, 100*lc/(lc+lm), lc, lc+lm, 100*bc/(bc+bm), bc, bc+bm}' "$CSV"
          done
          for SERVICE in accounts/contacts accounts/userservice frontend; do
            XML="src/$SERVICE/coverage.xml"
            [ -f "$XML" ] || continue
            python3 -c 'import sys, xml.etree.ElementTree as ET; r = ET.parse(sys.argv[1]).getroot(); print("%s: line %.1f%%, branch %.1f%%" % (sys.argv[2], 100 * float(r.get("line-rate")), 100 * float(r.get("branch-rate"))))' "$XML" "$SERVICE"
          done

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jvm-python
          if-no-files-found: ignore
          path: |
            src/ledger/*/target/site/jacoco/**
            src/**/coverage.xml

  angular-tests:
    name: Angular unit tests
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/ui-angular
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 16.10
        uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
          cache: 'npm'
          cache-dependency-path: src/ui-angular/package-lock.json

      - run: npm ci

      - name: Run tests with coverage
        continue-on-error: true
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui-angular
          if-no-files-found: ignore
          path: src/ui-angular/coverage/**
