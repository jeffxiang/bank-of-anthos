name: Unit Tests and Coverage

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Report-only: failures here do not block merges yet.
  make-test-unit:
    name: make test-unit (Java + Python)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run unit tests with coverage
        run: make test-unit

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-java-python
          path: |
            src/ledger/*/target/site/jacoco/jacoco.xml
            src/accounts/*/coverage.xml
            src/frontend/coverage.xml
          if-no-files-found: ignore

  angular-coverage:
    name: ui-angular test:coverage
    runs-on: ubuntu-22.04
    continue-on-error: true
    defaults:
      run:
        working-directory: src/ui-angular
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 16.10.0
        uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui-angular
          path: src/ui-angular/coverage
          if-no-files-found: ignore
