name: unit-tests-coverage
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  make-test-unit:
    # Report-only for now: coverage plumbing is new and must not block PRs.
    continue-on-error: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: astral-sh/setup-uv@v5
      - name: make test-unit
        run: make test-unit
      - name: upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-java-python
          path: |
            src/ledger/*/target/site/jacoco/jacoco.xml
            src/accounts/*/coverage.xml
          if-no-files-found: warn

  angular:
    continue-on-error: true
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src/ui-angular
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
      - name: npm ci
        run: npm ci
      - name: npm run test:coverage
        run: npm run test:coverage
      - name: upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui-angular
          path: src/ui-angular/coverage/
          if-no-files-found: warn
