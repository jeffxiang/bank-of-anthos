# Report-only coverage: every step is non-blocking (continue-on-error) and no
# thresholds are enforced. Reports are uploaded as build artifacts.
name: Unit Tests and Coverage (report-only)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-python:
    name: Java + Python coverage
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5

      - name: Run make test-unit (mvn test + pytest, with coverage)
        continue-on-error: true
        run: make test-unit

      - name: Coverage summary
        continue-on-error: true
        run: |
          for CSV in src/ledger/*/target/site/jacoco/jacoco.csv; do
            [ -f "$CSV" ] || continue
            echo "== $CSV"
            awk -F, 'NR>1 {bm+=$6; bc+=$7; lm+=$8; lc+=$9} END {
              printf "line: %.1f%% (%d/%d)  branch: %.1f%% (%d/%d)\n",
                100*lc/(lc+lm), lc, lc+lm, 100*bc/(bc+bm), bc, bc+bm }' "$CSV"
          done

      - name: Upload coverage reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-java-python
          path: |
            src/ledger/*/target/site/jacoco/**
            src/accounts/*/coverage.xml
          if-no-files-found: warn

  angular:
    name: Angular coverage
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 16.10
        uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
          cache: npm
          cache-dependency-path: src/ui-angular/package-lock.json

      - name: Install dependencies
        continue-on-error: true
        working-directory: src/ui-angular
        run: npm ci

      - name: Run tests with coverage
        continue-on-error: true
        working-directory: src/ui-angular
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui-angular
          path: src/ui-angular/coverage/**
          if-no-files-found: warn
