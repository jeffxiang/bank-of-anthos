name: Unit Tests and Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Report-only for now: failures do not block merges. Promote to a blocking
  # gate once the coverage baseline is established.
  jvm-and-python:
    name: make test-unit (Java + Python)
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run unit tests with coverage
        run: make test-unit

      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv, glob, xml.etree.ElementTree as ET

          def pct(covered, total):
              return covered * 100 / total if total else 0.0

          for f in sorted(glob.glob('src/ledger/*/target/site/jacoco/jacoco.csv')):
              lm = lc = bm = bc = 0
              for row in csv.DictReader(open(f)):
                  lm += int(row['LINE_MISSED']); lc += int(row['LINE_COVERED'])
                  bm += int(row['BRANCH_MISSED']); bc += int(row['BRANCH_COVERED'])
              print('%s: lines %.1f%%, branches %.1f%%'
                    % (f.split('/')[2], pct(lc, lc + lm), pct(bc, bc + bm)))

          for f in sorted(glob.glob('src/*/coverage.xml') + glob.glob('src/*/*/coverage.xml')):
              root = ET.parse(f).getroot()
              print('%s: lines %.1f%%, branches %.1f%%'
                    % (f.rsplit('/', 1)[0], float(root.get('line-rate')) * 100,
                       float(root.get('branch-rate')) * 100))
          PY

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-jvm-python
          path: |
            src/ledger/*/target/site/jacoco/**
            src/**/coverage.xml
          if-no-files-found: warn

  angular:
    name: ui-angular coverage
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 16.10
        uses: actions/setup-node@v4
        with:
          node-version: '16.10.0'
          cache: 'npm'
          cache-dependency-path: src/ui-angular/package-lock.json

      - name: Install dependencies
        working-directory: src/ui-angular
        run: npm ci

      - name: Run tests with coverage
        working-directory: src/ui-angular
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ui-angular
          path: src/ui-angular/coverage/**
          if-no-files-found: warn
