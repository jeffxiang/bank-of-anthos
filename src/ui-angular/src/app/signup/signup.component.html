<div class="container">
  <div class="card narrow">
    <h1>Register a new account</h1>
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="grid">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" formControlName="username">
          <small class="muted" *ngIf="form.controls.username.touched && form.controls.username.invalid">
            Username must contain 2 to 15 alphanumeric characters or underscores.
          </small>
        </div>
        <div class="form-group"><label for="password">Password</label><input id="password" type="password" formControlName="password"></div>
        <div class="form-group"><label for="passwordRepeat">Confirm Password</label><input id="passwordRepeat" type="password" formControlName="passwordRepeat"></div>
        <div class="form-group"><label for="firstname">First name</label><input id="firstname" formControlName="firstname"></div>
        <div class="form-group"><label for="lastname">Last name</label><input id="lastname" formControlName="lastname"></div>
        <div class="form-group"><label for="birthday">Birthday</label><input id="birthday" type="date" min="1900-01-01" [max]="maxBirthday" formControlName="birthday"></div>
        <div class="form-group">
          <label for="timezone">Timezone</label>
          <select id="timezone" formControlName="timezone">
            <option *ngFor="let timezone of timezones" [value]="timezone">{{ timezone }}</option>
          </select>
        </div>
      </div>
      <div class="form-group"><label for="address">Address</label><input id="address" formControlName="address"></div>
      <div class="grid">
        <div class="form-group"><label for="state">State</label><input id="state" formControlName="state"></div>
        <div class="form-group"><label for="zip">Zip</label><input id="zip" formControlName="zip"></div>
        <div class="form-group"><label for="ssn">SSN</label><input id="ssn" formControlName="ssn"></div>
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="submitting">Create Account</button>
      <a class="btn btn-secondary" routerLink="/login">Cancel</a>
    </form>
  </div>
</div>
