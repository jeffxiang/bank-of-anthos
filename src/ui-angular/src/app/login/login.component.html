<div class="container">
  <div class="card narrow">
    <h1>Bank of Anthos</h1>
    <p class="muted">Welcome</p>
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" formControlName="username" autocomplete="username">
        <small class="muted" *ngIf="form.controls.username.touched && form.controls.username.invalid">
          Please enter your username.
        </small>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password">
        <small class="muted" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Please enter your password.
        </small>
      </div>
      <button class="btn btn-primary" type="submit" [disabled]="submitting">Sign in</button>
    </form>
    <p><a routerLink="/signup">Create an Account</a></p>
  </div>
</div>
