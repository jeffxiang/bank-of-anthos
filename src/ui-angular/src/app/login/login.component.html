<main class="page container">
  <mat-card class="narrow">
    <mat-card-title>Bank of Anthos</mat-card-title>
    <mat-card-subtitle>Welcome</mat-card-subtitle>
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <form class="form-stack" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <mat-form-field appearance="outline">
        <mat-label>Username</mat-label>
        <input matInput id="username" formControlName="username" autocomplete="username">
        <mat-error *ngIf="form.controls.username.touched && form.controls.username.invalid">
          Please enter your username.
        </mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput id="password" type="password" formControlName="password" autocomplete="current-password">
        <mat-error *ngIf="form.controls.password.touched && form.controls.password.invalid">
          Please enter your password.
        </mat-error>
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" [disabled]="submitting">Sign in</button>
    </form>
    <a mat-button routerLink="/signup">Create an Account</a>
  </mat-card>
</main>
